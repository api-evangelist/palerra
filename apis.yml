name: Palerra
description: 'Palerra, Inc. was a Santa Clara, California cloud security company whose LORIC
  platform delivered Cloud Access Security Broker (CASB) capabilities: automated security
  monitoring, threat detection, configuration management, and compliance across SaaS and
  IaaS environments such as Salesforce, AWS, Microsoft Office 365, ServiceNow, and Box.
  Backed by Norwest Venture Partners and Wing Venture Capital, Palerra was acquired by
  Oracle in September 2016 and folded into the Oracle CASB Cloud Service. The palerra.com
  domain now redirects to Oracle''s cloud security portal, and no independent public API,
  developer portal, or machine-readable specification remains.'
